<aside class="sidebar">
  <a class="brand" routerLink="/home/agendamentos" aria-label="Bloodline — início">
    <span class="brand-mark" aria-hidden="true">B.</span>
    <span>Bloodline<small>TATTOO & PIERCING</small></span>
  </a>

  <div class="nav-label">ESTÚDIO</div>
  <nav aria-label="Navegação principal">
    <a routerLinkActive="active" ariaCurrentWhenActive="page" routerLink="/home/agendamentos">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M7 3v4m10-4v4M3 11h18m-13 5h2m4 0h2" />
      </svg>
      Agendamentos
    </a>
    <a routerLinkActive="active" ariaCurrentWhenActive="page" routerLink="/home/clientes">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 21v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m3 10v-2a6 6 0 0 0-2-4" />
      </svg>
      Clientes
    </a>
  </nav>

  <div class="sidebar-footer">
    <span class="avatar" aria-hidden="true">{{ nomeUsuario.charAt(0) }}</span>
    <div>
      <strong>{{ nomeUsuario }}</strong
      ><small>Administração</small>
    </div>
    <button class="logout" (click)="logout()">Sair</button>
  </div>
</aside>

<div class="workspace">
  <header class="topbar">
    <span>Gestão do estúdio</span><span class="topbar-label">BLOODLINE / PAINEL</span>
  </header>
  <main id="conteudo"><router-outlet /></main>
</div>
